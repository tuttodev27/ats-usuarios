services:
  postgres:
    image: postgres:16
    container_name: ats-user-postgres
    environment:
      POSTGRES_DB: ats_user
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ats_user_pg_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ats_users" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ats_user_pg_data:
