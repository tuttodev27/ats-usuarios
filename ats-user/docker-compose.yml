services:
  postgres:
    image: postgres:16
    container_name: ats-user-postgres
    environment:
      POSTGRES_DB: ats_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ats_user_pg_data:/var/lib/postgresql/data

volumes:
  ats_user_pg_data:
