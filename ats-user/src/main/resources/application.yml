server:
  port: 8083
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ats_users
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update   # OJO: ddl, no dll
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    secret: ats-users-dev-secret-change-in-prod-2026
    expiration-minutes: 50
